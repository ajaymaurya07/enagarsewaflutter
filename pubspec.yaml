name: enagarsewa
description: "Property Tax & Municipal Grievance Management - SECURE VERSION"
publish_to: 'none'

version: 2.3.5+39

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.1.0
  permission_handler: ^11.0.0
  crypto: ^3.0.3
  pointycastle: ^3.9.1
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^10.3.1
  device_info_plus: ^11.1.0
  google_fonts: ^6.2.1
  sqflite: ^2.4.2+1
  path: ^1.9.0
  share_plus: ^10.1.0
  path_provider: ^2.1.2
  pdf: ^3.10.7
  printing: ^5.11.1
  screenshot: ^3.0.0
  image_picker: ^1.0.7
  payu_checkoutpro_flutter: ^1.4.4
  intl: ^0.19.0
  tutorial_coach_mark: ^1.2.11
  webview_flutter: ^4.10.0
  firebase_core: ^3.14.0
  firebase_crashlytics: ^4.3.0
  firebase_messaging: ^15.2.7
  flutter_local_notifications: ^18.0.1
  in_app_update: ^4.2.3
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/e_nagar_seva_logo.png"
  min_sdk_android: 26
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/android_adaptive_foreground.png"
  adaptive_icon_foreground_inset: 20
  adaptive_icon_monochrome: "assets/icons/android_adaptive_monochrome.png"
  web:
    generate: true
    image_path: "assets/images/e_nagar_seva_logo.png"
  windows:
    generate: true
    image_path: "assets/images/e_nagar_seva_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/e_nagar_seva_logo.png
    - assets/rate_master.json
    - assets/certs/iamsup_chain.pem
  fonts:
    - family: Krutidev010
      fonts:
        - asset: assets/font/Kruti Dev 010 Regular.ttf
