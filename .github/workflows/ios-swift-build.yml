name: iOS (native Swift) build

on:
  workflow_dispatch:
  push:
    paths:
      - "ios-swift/**"
      - ".github/workflows/ios-swift-build.yml"

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios-swift
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install pods
        run: pod install --repo-update

      - name: Build for simulator (no signing)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace eNagarsewa.xcworkspace \
            -scheme eNagarsewa \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ios-swift/build.log
